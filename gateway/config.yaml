model_list:
  # Profile A: OpenAI models on Foundry use plain Azure Responses passthrough.
  - model_name: gpt-6.1-sol
    litellm_params: &foundry
      model: azure/gpt-6.1-sol
      # Use the bare resource URL, e.g. https://<resource>.openai.azure.com; do not add /openai/v1.
      api_base: os.environ/AZURE_FOUNDRY_API_BASE
      api_version: v1
      api_key: os.environ/AZURE_FOUNDRY_API_KEY
    model_info:
      # Codex sends effort "none" when its config or catalog says so (also via auto); Sol rejects it.
      reasoning_effort_none_as: medium

  # Profile B: Partner models remove unsupported reasoning effort and enable Codex tool compatibility.
  - model_name: DeepSeek-V4-Pro
    litellm_params: &partner
      <<: *foundry
      model: azure/DeepSeek-V4-Pro
      additional_drop_params: ["reasoning.effort"]
    model_info: &compat
      codex_tools_compat: true
  - model_name: DeepSeek-V4-Flash
    litellm_params:
      <<: *partner
      model: azure/DeepSeek-V4-Flash
      # Retry short-window Azure 429 and peak-load rejections.
      num_retries: 2
    model_info: *compat
  - model_name: Kimi-K2.7-Code
    litellm_params:
      <<: *partner
      model: azure/Kimi-K2.7-Code
      # Retry short-window Azure 429 and peak-load rejections.
      num_retries: 2
    model_info: *compat
  - model_name: grok-4.7
    litellm_params:
      <<: *partner
      model: azure/grok-4.7
      # Retry short-window Azure 429 and peak-load rejections.
      num_retries: 2
    model_info: *compat

  # Profile D: decision models (System One wire format) on the Foundry Microsoft provider route.
  # Served on /v1/decisions and /v1/systemone; not used by Codex. The callback guard applies.
  - model_name: Decision-1
    litellm_params:
      model: typesafe/Decision-1
      # <AZURE_FOUNDRY_API_BASE>/providers/microsoft. The callback refuses any base that is
      # not an https Azure host, so an empty or foreign value fails locally.
      api_base: os.environ/AZURE_FOUNDRY_DECISIONS_BASE
      api_key: os.environ/AZURE_FOUNDRY_API_KEY

  # Optional complexity router; used only when a client selects `auto`. See README.
  - model_name: auto
    litellm_params:
      model: auto_router/complexity_router
      complexity_router_config:
        classifier_type: jev
        jev_classifier_config:
          deployment_name: Decision-1
          timeout_ms: 3000
        tiers:
          SIMPLE: DeepSeek-V4-Flash
          MEDIUM: DeepSeek-V4-Pro
          COMPLEX: gpt-6.1-sol
          REASONING: gpt-6.1-sol
        # A failed or timed-out classifier call routes to the cheapest model instead of guessing.
        default_model: DeepSeek-V4-Flash
        classifier_fallback: default_model
        session_affinity: true
        session_affinity_ttl_seconds: 86400
    # The callback keys on the requested model name, so the flag must sit on `auto` itself.
    model_info:
      codex_tools_compat: true

litellm_settings:
  callbacks: ["codex_tools_compat.codex_tools_compat"]
  request_timeout: 600

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
